services:
  db:
    image: postgres:16-alpine
    container_name: trustee_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: trustee_antifish
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustee_antifish"]
      interval: 5s
      timeout: 5s
      retries: 5

  monitor:
    build: .
    container_name: trustee_daemon
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: python main.py --daemon

volumes:
  postgres_data:
